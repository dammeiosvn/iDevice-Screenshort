<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="iScreenshort+">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <title>iScreenshort+</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-180.png">
  <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
  <header class="top">
    <h1>iScreenshort+</h1>
    <div class="row">
      <button type="button" id="share" class="go">Xuất</button>
      <button type="button" id="shareAll" class="go alt" hidden>Bộ</button>
    </div>
  </header>

  <main>
    <section class="stage">
      <canvas id="view"></canvas>
      <button type="button" class="empty" id="empty">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 5h6"/><path d="M19 2v6"/><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/><circle cx="9" cy="9" r="2"/></svg>
        thêm ảnh
      </button>
      <p class="toast" id="toast" hidden>di chuyển để khớp</p>
      <div class="pager" id="pager" hidden>
        <button type="button" id="prev">‹</button>
        <span id="count">1/1</span>
        <button type="button" id="next">›</button>
      </div>
    </section>

    <section class="panel">
      <div class="trio">
        <div class="menu">
          <span>Loại</span>
          <button type="button" id="typeBtn">iPhone</button>
          <div class="pop" id="typePop" hidden></div>
        </div>
        <div class="menu">
          <span>Thiết bị</span>
          <button type="button" id="deviceBtn">Máy</button>
          <div class="pop" id="devicePop" hidden></div>
        </div>
        <div class="menu">
          <span>Màu máy</span>
          <button type="button" id="colorBtn">Màu</button>
          <div class="pop" id="colorPop" hidden></div>
        </div>
      </div>

      <div class="seg" id="tools">
        <button type="button" data-k="orient" data-v="Portrait">Dọc</button>
        <button type="button" data-k="orient" data-v="Landscape">Ngang</button>
        <button type="button" data-k="mode" data-v="fit">Fit</button>
        <button type="button" data-k="mode" data-v="fill">Fill</button>
      </div>

      <div class="trio">
        <label class="field">Nền xuất
          <select id="bg">
            <option value="clear">Trong suốt</option>
            <option value="system">Hệ thống</option>
            <option value="light">Sáng</option>
            <option value="dark">Tối</option>
            <option value="custom">Màu</option>
            <option value="grad">Gradient</option>
            <option value="image">Ảnh nền</option>
          </select>
        </label>
        <label class="field">Cỡ xuất
          <select id="size">
            <option value="full">Gốc</option>
            <option value="1080">1080</option>
            <option value="story">Story</option>
          </select>
        </label>
        <label class="field">Ký tên
          <button type="button" class="ctl" id="signBtn">Ký tên</button>
        </label>
      </div>
      <div class="tune">
        <label class="inline"><input id="bgColor" type="color" value="#0a84ff" aria-label="Màu nền"><span>Màu nền</span></label>
        <label class="inline" id="bg2wrap" hidden><input id="bgColor2" type="color" value="#5e5ce6" aria-label="Màu 2"><span>Màu 2</span></label>
        <button type="button" class="ctl mini" id="bgImgBtn" hidden>Ảnh</button>
        <label class="check"><input id="shadow" type="checkbox"><span>Bóng đổ</span></label>
        <label class="slide">Đậm <em id="shadeVal">40</em>
          <input id="shade" type="range" min="0" max="100" value="40">
        </label>
      </div>
    </section>
  </main>

  <p class="brand"><span>Sentechtipsvn</span></p>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-head">
        <strong>Ký tên</strong>
        <button type="button" id="sheetClose">Đóng</button>
      </div>
      <label class="field">Tên
        <input id="signName" maxlength="32" placeholder="Tên" autocomplete="off">
      </label>
      <div class="seg" id="corners">
        <button type="button" data-x="12" data-y="10">Trái trên</button>
        <button type="button" data-x="88" data-y="10">Phải trên</button>
        <button type="button" data-x="12" data-y="90">Trái dưới</button>
        <button type="button" data-x="88" data-y="90">Phải dưới</button>
      </div>
      <label class="slide">Màu <em id="hueVal">200</em>
        <input id="hue" type="range" min="0" max="360" value="200">
      </label>
      <label class="slide">Cỡ <em id="sizeVal">48</em>
        <input id="signSize" type="range" min="16" max="160" value="48">
      </label>
      <label class="slide">Xoay <em id="rotVal">0°</em>
        <input id="rot" type="range" min="-180" max="180" value="0">
      </label>
      <label class="slide">Ngang <em id="sxVal">50</em>
        <input id="sx" type="range" min="0" max="100" value="50">
      </label>
      <label class="slide">Dọc <em id="syVal">92</em>
        <input id="sy" type="range" min="0" max="100" value="92">
      </label>
      <label class="check"><input id="stroke" type="checkbox" checked><span>Viền chữ</span></label>
      <label class="check"><input id="signShadow" type="checkbox" checked><span>Bóng chữ</span></label>
    </div>
  </div>

  <input id="file" type="file" accept="image/*" multiple hidden>
  <input id="bgFile" type="file" accept="image/*" hidden>
  <script src="js/app.js?v=10" defer></script>
</body>
</html>
